# DigitalOcean App Platform — static site spec for tools.raulkalev.ee
#
# Create the app once with:
#   doctl apps create --spec .do/app.yaml
# Thereafter App Platform redeploys automatically on every push to main.
#
# After the first deploy, App Platform shows the CNAME target for the domain
# (something like <app-name>-<hash>.ondigitalocean.app). Add that as a CNAME
# for `tools` in the zone.ee DNS panel. TLS is provisioned automatically.

name: rktools
region: fra

static_sites:
  - name: site
    github:
      repo: RaulKalev/rktools
      branch: main
      deploy_on_push: true

    # The repository root is the document root — index.html, plugins/,
    # pulse/, resources/, robots.txt and sitemap.xml are served as-is.
    source_dir: /
    output_dir: /

    index_document: index.html
    error_document: 404.html

    # Keep this list in sync with the canonical URLs in the page <head>s.
    # Adding the apex here later is how the site moves to raulkalev.ee.
    routes:
      - path: /

domains:
  # No `zone:` key on purpose. `zone:` tells App Platform to manage the DNS
  # record itself, which only works when the zone is hosted in DigitalOcean
  # DNS. This zone is hosted at zone.ee (ns.zone.eu / ns2.zone.ee /
  # ns3.zonedata.net), so the CNAME is added manually in the zone.ee panel.
  - domain: tools.raulkalev.ee
    type: PRIMARY
